<!DOCTYPE html>

<style>
:root{--y:#B88A00;--yl:#fff;--k:#000;--g:#000}

#deck{position:fixed;inset:0 0 5.2rem 0}

.slide.on{display:flex;flex-direction:column}
.slide:before{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:5rem 5rem 0 0;border-color:var(--y) transparent transparent transparent}

.sm .it{font-size:1.25rem;line-height:2.3rem;margin:.3rem 0}
.mc{width:24rem;border:.3rem solid #000;border-radius:1rem;padding:1.2rem;text-align:center;font-size:1.6rem;flex:none}.vi{font-size:6.5rem;line-height:1.2}
.st{display:none;align-items:center;gap:1rem;border:.2rem solid var(--y);border-radius:.8rem;padding:.6rem 1rem;margin:.5rem 0;font-size:1.6rem}.st.on{display:flex}
.st i{background:var(--y);color:#fff;font-style:normal;font-weight:700;width:2.6rem;height:2.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.st small{font-size:1rem;font-weight:700}
td select{font-size:1rem;padding:0 .2rem}td{line-height:1.2}</style></head><body>
<div id="deck"></div>
<div id="bar"><button onclick="go(-1)">Previous</button><button onclick="go(1)">Next</button><span id="pg"></span><span style="flex:1"></span><span id="tms"></span><button class="l" style="background:#fff" onclick="tn()">Notes</button></div>
<script>
const E=(a,b,o,w)=>({q:a,a:b,o:o,w:w});
const MSG=[["f","Hey, Inna. Are you going to work?"],["i","No, I'm not. I'm on the bus. I'm going to my parents' house."],["f","You usually ride your bike there. Why are you taking the bus?"],["i","Because I'm carrying a big plant. Oh, I'm at the bus stop now, and my dad's waiting."],["f","😆 Ha ha! A plant! Why are you carrying a plant?"],["i","Because plants don't walk! 😊😊😊 Really it's for my mom's birthday."],["f","Oh, wow! Say happy birthday from me."]];
const chat=()=>'<div class="chat">'+MSG.map(m=>`<div class="b ${m[0]}">${m[1]}</div>`).join("")+'</div>';
const V=[
["🚌","You go on a bus, train or subway as a passenger.","take the bus / train / subway","/teɪk/","take + the + transport. I take the subway to work.","What does Inna take? (the bus)"],
["🏠","You move from one place to another place.","go to a store / your parents' house","/ɡəʊ tə/","go + to + place. I'm going to my parents' house.","Does 'go' need 'to'? (yes)"],
["🚶","You move on your feet, not in a car.","walk","/wɔːk/","verb: walk → walking. She's walking to her friend's house.","Do you use a bike to walk? (no)"],
["🚏","You are in this place: the bus is not here yet.","be at the bus stop / train station","/æt ðə bʌs stɒp/","be + at + place. I'm at the bus stop now.","Is Inna on the bus or at the bus stop? (at)"],
["👜","You hold something in your hands or on your back.","carry a bag","/ˈkæri/","carry → carrying. Inna is carrying a big plant.","Is the bag heavy or light for a plant? Discuss."],
["⏳","You stay in a place. You want someone or something to come.","wait","/weɪt/","wait for + person. Her dad is waiting.","Does Inna's dad drive or wait? (wait)"],
["🚴","You sit on a bike and move the pedals.","ride my bike","/raɪd/","ride → riding. You usually ride your bike.","Do you ride a bike or a car? (bike)"],
["🚆","You are inside the bus, train or subway now.","be on the bus / train / subway","/ɒn ðə bʌs/","be + on + transport. I'm on the bus.","Is she inside the bus? (yes)"],
["🚗","You control a car and make it go.","drive","/draɪv/","drive → driving. They're driving to the beach.","Who controls the car? (the driver)"]];
const S=[];
const N=o=>`<b>Aim:</b> ${o.a}<br><b>Time:</b> ${o.t}<br><b>Steps:</b><ol>${o.s.map(x=>`<li>${x}</li>`).join("")}</ol>`+(o.i?`<b>ICQ:</b> ${o.i}<br>`:"")+(o.c?`<b>CCQ:</b> ${o.c}<br>`:"")+(o.p?`<b>Possible problems:</b> ${o.p}<br>`:"")+(o.k?`<b>Answer key:</b> ${o.k}`:"");

const HLP=[/going to work/,/on the bus/,/going to my parents' house/,/ride your bike/,/taking the bus/,/carrying a (big )?plant/,/at the bus stop/,/waiting/,/walk/];
const chatHL=()=>'<div class="chat">'+MSG.map(m=>`<div class="b ${m[0]}">${HLP.reduce((a,r)=>a.replace(r,'<span class="hl">$&</span>'),m[1])}</div>`).join("")+'</div>';
const BK=["Am","Is","Are","am","is","are"];
const SEL=a=>`<select data-a="${a}"><option value=""> ? </option>${BK.map(x=>`<option>${x}</option>`).join("")}</select>`;
const AW='Give a point: '+[0,1,2,3].map(t=>`<button class="l" onclick="sc(${t},1)">Team ${t+1} +1</button>`).join("");
const BT=i=>`<div class="btns"><button onclick="chk(${i})">Check</button><button class="y" onclick="shw(${i})">Show all answers</button><button class="l" onclick="hd(${i})">Hide answers</button><button class="l" onclick="rs(${i})">Try again</button><span class="msg" id="m${i}"></span></div><div class="aw">${AW}</div>`;
const CHT=`<table style="font-size:1rem"><tr><th colspan=2>Yes/no questions</th><th>Short answers</th></tr><tr><td>I</td><td>[[Am]] I talking to John?</td><td>Yes, you [[are]]. / No, you're not.</td></tr><tr><td>He / She / It</td><td>[[Is]] she cleaning the house?</td><td>Yes, she [[is]]. / No, she's not.</td></tr><tr><td>You / They</td><td>[[Are]] they waiting at the bus stop?</td><td>Yes, they [[are]]. / No, they're not.</td></tr></table><table style="margin-top:.5rem;font-size:1rem"><tr><th colspan=5>Information questions</th></tr><tr><td>I</td><td>Who</td><td>[[am]]</td><td>I</td><td>talking to?</td></tr><tr><td>He / She / It</td><td>Why / Where / How</td><td>[[is]]</td><td>he / she / it</td><td>carrying a bag? working today? going?</td></tr><tr><td>You / We / They</td><td>What / Who</td><td>[[are]]</td><td>we / you / they</td><td>doing right now? waiting for?</td></tr></table><div class="box" style="font-size:.95rem;padding:.3rem .8rem">Answer <i>Why</i> questions with <i>because</i>: He's carrying a bag because he has a lot of books.</div>`;
S.push({t:"Texting on the Run",h:`<div class="body"><div class="col"><h1>7.2 Texting on the Run</h1><div class="box">Today I can ask and answer questions about where people are going and what they are doing.</div><div class="big">🚌 📱 🌿</div></div></div>`,n:"Set the objective. ICQ: Are we going to write or speak today? (speak)"});
S.push({t:"Quick chat",h:`<div class="ins">How do you usually get to these places?</div><div class="body" style="font-size:2rem">${[["🏫 English class","I take the bus to English class.<br>I walk to class."],["🛒 the supermarket","I drive to the supermarket.<br>I walk to the store."],["💼 work / college","I take the subway to work.<br>I ride my bike to college."],["🏠 your best friend's house","I walk to my friend's house.<br>I drive to her house."]].map(a=>`<div class="col box">${a[0]}<div class="sg hid" style="font-size:1.3rem;margin-top:.8rem">${a[1]}</div></div>`).join("")}</div><div class="btns"><button class="y" onclick="this.closest('.slide').querySelectorAll('.sg').forEach(e=>e.classList.toggle('hid'))">Show / hide suggested answers</button></div>`});
S.push({t:"Lead-in: the phone",h:`<div class="ins">Look at the phone. Who is Inna? Where is she? What is she carrying?</div><div class="body"><div class="big" style="font-size:9rem">👩📱🌿</div><div class="col">${chat().replace('class="chat"','class="chat hid" id="lc"')}<div class="btns"><button class="y" onclick="document.getElementById('lc').classList.toggle('hid')">Show / hide the text messages</button></div></div></div>`,n:"Set context with the picture (a woman, a phone, a big plant). CCQ: Is this a letter or a text message? (a text message)"});
S.push({t:"2A Read for gist",ins:"Read the text messages. Where is Inna going? Why?",h:`<div class="body">${chat()}<div class="col"><div id="g" class="box hid">Inna is going to her parents' house. It's her mom's birthday, and the plant is a present.</div><div class="btns"><button class="y" onclick="document.getElementById('g').classList.toggle('hid')">Show / hide the answer</button></div></div></div>`,n:"Give 1 minute. Peer check. ICQ: Do you read every word? (no, just the main idea)"});
S.push({t:"2B Read for detail",cls:"sm",ins:"Read the text messages again. Correct the sentences.",ex:[E("1 <s>Inna is taking the bus to the mall.</s><br>Inna is taking the bus to __ .",["her parents' house","her parents house"],0,2),E("2 <s>Inna's dad is waiting at his house.</s><br>Inna's dad is waiting __ .",["at the bus stop"],0,2),E("3 <s>Inna is carrying a big bag.</s><br>Inna is carrying a big __ .",["plant"],0,2),E("4 <s>Today is Inna's dad's birthday.</s><br>Today is Inna's __ birthday.",["mom's","mom","mother's"],0,2)]});
S.push({t:"Notice the language",ins:"Read the text messages again. Which words are about transportation and places?",h:`<div class="body" id="nb">${chatHL()}<div class="col"><div class="box">Find and underline the words you notice.</div><div class="btns"><button class="y" onclick="document.getElementById('nb').classList.toggle('showhl')">Highlight the new language</button></div></div></div>`,n:"Noticing stage before MPF. Students find transportation and place phrases in pairs, then click Highlight to check. ICQ: Are you reading for the main idea or finding phrases? (finding phrases)"});
const IQ=["Do you say the phrase first or guess first? (guess first)","Do we write it now? (no, we say it)","Do we repeat together first or alone? (together)"];
const VP=["Students may say 'take bus' without the; stress BUS.","Use 'go to', not 'go at' / 'go in'.","'walk' /wɔːk/: silent l; do not say 'work'.","'at' for places (bus stop), 'on' for transport: contrast with the next phrase.","Spelling of carry → carrying (y stays).","Wait FOR someone; students may say 'wait someone'.","Ride a bike, not 'drive a bike'.","'on' the bus, not 'in' the bus.","Drive /draɪv/ vs ride; drive needs a car."];
V.forEach((v,i)=>S.push({t:`Vocabulary ${i+1}/9`,flip:v,n:N({a:`Teach "${v[2]}" with MPF.`,t:"2-3 min",s:["<b>Meaning:</b> show the icon and read the definition. Teams guess the phrase; click Reveal next to confirm.","<b>Pronunciation:</b> Reveal next; model 3 times at natural speed, then choral and individual drilling; mark stress on the board.","<b>Form:</b> Reveal next; show the pattern and the example from the chat; ask for one new example."],i:IQ[i%3],c:v[5],p:VP[i]})}));
S.push({t:"1B Choose the correct words",ins:"Choose the correct words from the menu to complete the sentences.",ex:[E("1 I <i>__</i> to class every day.",["ride my bike"],[["ride my bike","am at the bus stop"]]),E("2 I'm <i>__</i> for a friend right now.",["waiting"],[["waiting","walking"]]),E("3 We <i>__</i> to work on Fridays.",["take the subway"],[["are on the train","take the subway"]]),E("4 Are you <i>__</i> right now?",["carrying"],[["carrying","walking"]]),E("5 I'm <i>__</i> right now.",["at the train station"],[["at the train station","to the mall"]])]});
S.push({t:"Page 147 A",cls:"sm",ins:"Complete the sentences with the correct verbs.",box:"driving · going · riding · taking · waiting · walking",ex:[E("1 I'm not __ to work because my son has my car today.",["driving"]),E("2 Where are you? Mike is __ for you at the train station.",["waiting"]),E("3 Carolina is __ with her dog in the park right now.",["walking"]),E("4 We're __ to the mall because we need new shoes.",["going"]),E("5 Tonya is __ her bike to the store.",["riding"]),E("6 Mark isn't __ the bus to class because it's late.",["taking"])],sel:["driving","going","riding","taking","waiting","walking"]});
const GP=[/Are you going to work\?/,/Why are you taking the bus\?/,/Why are you carrying a plant\?/];
S.push({t:"Notice the grammar",ins:"Read the chat again. Find the questions. Underline them.",h:`<div class="body" id="ng"><div class="chat">${MSG.map(m=>`<div class="b ${m[0]}">${GP.reduce((a,r)=>a.replace(r,'<span class="hl">$&</span>'),m[1])}</div>`).join("")}</div><div class="col"><div class="box">How many questions can you find?</div><div class="btns"><button class="y" onclick="document.getElementById('ng').classList.toggle('showhl')">Highlight the questions</button></div></div></div>`});
S.push({t:"3A Choose the correct answer",ins:"Look at the questions in the chat. Choose the correct answer from the menu.",ex:[E("1 Use <i>are</i> and <i>is</i> __ of yes/no questions.",["at the beginning"],[["at the beginning","in the middle"]]),E("2 Use <i>are</i> and <i>is</i> __ question words (What, When…) in information questions.",["after"],[["before","after"]])],extra:`<div class="chat" style="width:30rem;flex:none"><div class="b f">Are you going to work?</div><div class="b i">No, I'm not.</div><div class="b f">Why are you taking the bus?</div><div class="b i">Because I'm carrying a big plant.</div><div class="b f">Why are you carrying a plant?</div><div class="b i">Because plants don't walk!</div></div>`,n:"Elicit from the chat. Highlight 'Are you going…' and 'Why are you taking…'. CCQ: What word comes first in 'Why are you taking the bus?' (Why)"});
S.push({t:"Grammar chart",ins:"Which word comes first? Fill in the table.",tbl:CHT,n:"Elicit the rule from the chat first. Then one student comes to the board or calls out the answer for each blank. CCQ: In a yes/no question, which word comes first? (am / is / are). ICQ: Do you read or fill in the table? (fill in)"});
S.push({t:"3B Complete the questions",ins:"Complete the questions with the present continuous.",box:"carry · do · go · listen · ride",ex:[{q:"1 __ Josh __ his bike in the park right now?",a:["Is","riding"]},{q:"2 What __ Kim and Todd __ ?",a:["are","doing"]},{q:"3 __ the children __ to music right now?",a:["Are","listening"]},{q:"4 Why __ Jamal __ a big bag?",a:["is","carrying"]},{q:"5 Where __ Lydia __ now?",a:["is","going"]}]});
S.push({t:"3B Match the answers",ins:"Match the questions (1–5) with the answers (a–e).",cls:"sm",cards:[["a","Because he's taking a lot of books to class."],["b","Yes, they are."],["c","She's walking to her friend's house."],["d","No, he isn't. He's running by the lake."],["e","They're driving to the beach."]],ex:[E("1 Is Josh riding his bike in the park right now? __",["d"]),E("2 What are Kim and Todd doing? __",["e"]),E("3 Are the children listening to music right now? __",["b"]),E("4 Why is Jamal carrying a big bag? __",["a"]),E("5 Where is Lydia going now? __",["c"])],sel:["a","b","c","d","e"]});
S.push({t:"Page 135 A Write the questions",cls:"sm",ins:"Write questions for the answers. Use the words in ( ).",ex:[E("1 (you / send / a text to Carol) __ — No, I'm not. I'm calling her.",["Are you sending a text to Carol"],0,1),E("2 (why / we / wait / for Paul) __ — Because he's driving us home.",["Why are we waiting for Paul"],0,1),E("3 (Denny and Pam / do / the dishes) __ — Yes, they are.",["Are Denny and Pam doing the dishes"],0,1),E("4 (Sandra / wash / the dog) __ — No, she isn't. She's watching TV.",["Is Sandra washing the dog"],0,1),E("5 (who / your sister / help / right now) __ — My brother.",["Who is your sister helping right now"],0,1)]});
S.push({t:"3D Pair work",h:`<div class="ins">Imagine what people in your family are doing right now. Ask and answer questions.</div><div class="body"><div class="chat"><div class="b f">What's your sister doing right now?</div><div class="b i">She's driving to work. Is your brother working?</div></div><div class="col box">Use: <b>Is / Are</b> … ? · <b>What / Where / Why / Who</b> are / is … ?</div></div>`,n:"Model with one student. Monitor for is/are errors. Delayed feedback on the board."});
S.push({t:"4 Speaking",h:`<div class="ins">A. Imagine you're going somewhere and carrying something interesting or funny. Decide where you are going and your transportation.</div><div class="body" style="font-size:2rem"><div class="box">🛍️ a big bag</div><div class="box">🪑 a small chair</div><div class="box">🖼️ an expensive picture</div><div class="col"><div class="ins" style="font-size:1.3rem">B. Pair work: What is your partner doing? Ask and answer questions.</div><div class="chat" style="width:auto"><div class="b f">Hi, Anna. What are you doing?</div><div class="b i">I'm carrying 100 cookies. I'm at the subway station.</div></div></div></div>`,n:"Give 2 minutes to plan. Pairs ask and answer. Feedback on content first, then language."});
S.push({t:"Well done!",h:`<div class="body"><div class="col"><h1>Great work! 🎉</h1><div class="box">Can you ask and answer questions about where people are going and what they are doing?</div></div></div>`});
S.push({t:"Extra",h:`<div class="body"><div class="col"><h1>Extra</h1><div class="box">More practice: page 147 B</div></div></div>`});
S.push({t:"Page 147 B",ins:"Choose the correct words from the menu.",ex:[E("1 Vic is <i>__</i>.",["at the bus stop"],[["at the bus stop","his bike"]]),E("2 Why are you carrying <i>__</i>?",["a plant"],[["a plant","the train"]]),E("3 I usually take <i>__</i> to work.",["the subway"],[["the train station","the subway"]]),E("4 When are you going to your <i>__</i>?",["parents' house"],[["parents' house","mall"]]),E("5 I'm sorry. I'm busy. I'm on <i>__</i>.",["the train"],[["the bus stop","the train"]])]});
